<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitterField — Account</title><style>body{font-family:system-ui;max-width:680px;margin:auto;padding:32px;background:#0b0d0f;color:#fff}input,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:1px solid #444;box-sizing:border-box}button{cursor:pointer;font-weight:700}a{color:#fff}.card{background:#15191d;padding:24px;border-radius:18px;margin:20px 0}.hidden{display:none}</style></head><body><a href="/">← FitterField</a><div class="card"><h1>FitterField Pro</h1><p>Create your account or log in to access your toolkit.</p><div id="auth"><h2>Log in</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Password"><button onclick="login()">Log In</button><hr><h2>Create account</h2><input id="regEmail" type="email" placeholder="Email"><input id="regPass" type="password" placeholder="Password (8+ characters)"><button onclick="register()">Create Account</button></div><div id="member" class="hidden"><p id="status"></p><button onclick="checkout()">Continue to secure checkout — $29.99</button><button onclick="logout()">Log out</button></div><p id="msg"></p></div><script>async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function msg(x){document.getElementById('msg').textContent=x}async function check(){try{let u=await api('/api/me');if(!u.user){return}document.getElementById('auth').classList.add('hidden');document.getElementById('member').classList.remove('hidden');document.getElementById('status').textContent=u.paid?'Your Pro access is active.':'Account created. Complete the $29.99 purchase to unlock Pro.'}catch(e){msg(e.message)}}async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({email:loginEmail.value,password:loginPass.value})});location.reload()}catch(e){msg(e.message)}}async function register(){try{await api('/api/register',{method:'POST',body:JSON.stringify({email:regEmail.value,password:regPass.value})});location.reload()}catch(e){msg(e.message)}}async function checkout(){try{let x=await api('/api/checkout',{method:'POST'});location.href=x.url}catch(e){msg(e.message)}}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}check()</script></body></html>
