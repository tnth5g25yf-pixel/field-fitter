services:
  - type: web
    name: fitter-field
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
